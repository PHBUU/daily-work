<style>
:root{--bg:#EDF1EF;--ink:#18262E;--muted:#5D6B70;--brand:#0E4F54;--lamp:#1E2C32;--red:#CF4034;--yellow:#E0A019;--green:#2E9559}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;line-height:1.7}
[hidden]{display:none!important}

/* ระบบจริง (Apps Script) ฝังเต็มหน้าจอ */
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}

/* หน้าเปิดระบบ / หน้าโหลด */
.cover{position:fixed;inset:0;display:grid;place-items:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));background:var(--bg);z-index:2;transition:opacity .35s}
.cover.gone{opacity:0;pointer-events:none}
.card{width:min(440px,100%);display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center}
.lamp{grid-row:span 3;display:grid;gap:10px;background:var(--lamp);padding:14px 12px;border-radius:40px}
.lamp i{width:30px;height:30px;border-radius:50%;background:#3a4a50}
.lamp i:nth-child(1){animation:on-r 2.4s .1s both}
.lamp i:nth-child(2){animation:on-y 2.4s .5s both}
.lamp i:nth-child(3){animation:on-g 2.4s .9s both}
@keyframes on-r{30%,100%{background:var(--red);box-shadow:0 0 14px var(--red)}}
@keyframes on-y{30%,100%{background:var(--yellow);box-shadow:0 0 14px var(--yellow)}}
@keyframes on-g{30%,100%{background:var(--green);box-shadow:0 0 14px var(--green)}}
h1{margin:0;font-size:clamp(21px,5.2vw,27px);line-height:1.35;font-weight:700;color:var(--brand)}
.org{margin:0;color:var(--muted);font-size:15px}
.status{margin:0;font-size:15px}
.actions{grid-column:1/-1;display:grid;gap:10px;margin-top:18px}
.btn{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:14px 18px;font-weight:600;font-size:17px;background:var(--brand);color:#fff}
.btn:focus-visible,.link:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.note{grid-column:1/-1;margin:14px 0 0;font-size:14px;color:var(--muted)}
.link{color:var(--brand);font-weight:600}
@media (prefers-reduced-motion:reduce){
  .lamp i{animation:none}
  .lamp i:nth-child(1){background:var(--red)} .lamp i:nth-child(2){background:var(--yellow)} .lamp i:nth-child(3){background:var(--green)}
  .cover{transition:none}
}
</style>
</head>
<body>
<iframe id="app" title="ระบบบันทึกผลการปฏิบัติงานประจำวัน" allow="clipboard-write" hidden></iframe>

<div class="cover" id="cover">
  <div class="card">
    <div class="lamp" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>ระบบบันทึกผลการปฏิบัติงานประจำวัน</h1>
    <p class="org">คณะสาธารณสุขศาสตร์ มหาวิทยาลัยบูรพา</p>
    <p class="status" id="status" role="status">กำลังเปิดระบบ…</p>

    <div class="actions" id="actions" hidden>
      <a class="btn" id="openBtn" href="#" target="_top">เข้าสู่ระบบ</a>
    </div>
    <p class="note" id="note" hidden></p>
  </div>
</div>

<script>
/* ===== ตั้งค่า: ใส่ URL เว็บแอป Apps Script (ลงท้ายด้วย /exec) ===== */
const APP_URL = 'https://script.google.com/a/macros/go.buu.ac.th/s/AKfycbyXpF3KI5fq980T7PB66npADH4apVlUtG0k2gY1VvWCXqt2yIqwRkt42yiY1swe8uFO/exec';

const $ = id => document.getElementById(id);
const openDirect = APP_URL;
$('openBtn').href = openDirect;

// Safari และทุกเบราว์เซอร์บน iPhone/iPad บล็อกคุกกี้ Google ในกรอบฝัง (iframe)
// จึงเปิดระบบโดยตรงแทน ส่วนเบราว์เซอร์อื่นฝังระบบไว้ในหน้านี้
const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isSafari = /^((?!chrome|chromium|crios|fxios|edg|android).)*safari/i.test(ua);
const mode = new URLSearchParams(location.search).get('mode'); // ?mode=direct หรือ ?mode=frame

if (mode === 'direct') {
  location.replace(openDirect);
} else if ((isIOS || isSafari) && mode !== 'frame') {
  showLaunch('แตะปุ่มด้านล่างเพื่อเข้าใช้งานด้วยบัญชี Google ของมหาวิทยาลัย',
    'เพิ่มหน้านี้ไว้ที่หน้าจอโฮม: กดปุ่มแชร์ แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"');
} else {
  const frame = $('app');
  frame.hidden = false;
  frame.addEventListener('load', () => {
    $('cover').classList.add('gone');
    setTimeout(() => { $('cover').hidden = true; }, 400);
  });
  frame.src = openDirect;
  // โหลดนานผิดปกติ: เสนอให้เปิดโดยตรง
  setTimeout(() => {
    if (!$('cover').classList.contains('gone')) {
      showLaunch('ระบบโหลดช้ากว่าปกติ', 'ถ้าหน้ายังไม่ขึ้น กดเข้าสู่ระบบเพื่อเปิดโดยตรง');
    }
  }, 10000);
}

function showLaunch(status, note) {
  $('status').textContent = status;
  $('actions').hidden = false;
  $('note').hidden = !note;
  $('note').textContent = note || '';
  $('openBtn').focus();
}
</script>
</body>
</html>
